<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="./style.css">

  <title>Frontend Mentor | Profile card component</title>
</head>

<body>
  <main>
    <div>
      <div class="bg-top"></div>
      <div class="bg-bottom"></div>

      <div class="card">
        <div class="card-top">
          <img src="./images/image-victor.jpg" alt="Profile picture of Victor Crest" class="image" />
        </div>

        <div class="card-body">
          <h2>Victor Crest <span>26</span></h2>
          <p>London</p>
        </div>

        <div class="card-footer">
          <div class="details">
            <h3>80k</h3>
            <p>Followers</p>
          </div>
          <div class="details">
            <h3>803k</h3>
            <p>Likes</p>
          </div>
          <div class="details">
            <h3>1.4k</h3>
            <p>Posts</p>
          </div>
        </div>
      </div>
    </div>
  </main>

</body>

</html>
